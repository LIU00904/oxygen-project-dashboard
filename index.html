<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>氧气科技项目管理</title>
    <link rel="stylesheet" href="./styles.css?v=20260629-progress-fix-v1" />
  </head>
  <body>
    <div class="iridescence-container" id="iridescenceBg" aria-hidden="true"></div>
    <main class="app-shell">
      <section class="topbar glass">
        <div>
          <p class="eyebrow">Oxygen Project OS</p>
          <h1>氧气科技项目管理</h1>
          <p class="subline">项目进度与开票状态管理</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="exportBtn" title="导出数据" aria-label="导出数据">
            <span>↓</span>
          </button>
        </div>
      </section>

      <section class="metrics">
        <article class="metric glass">
          <span>项目总数</span>
          <strong id="totalProjects">0</strong>
        </article>
        <article class="metric glass">
          <span>进行中平均进度</span>
          <strong id="avgProgress">0%</strong>
        </article>
        <article class="metric glass">
          <span>待开票</span>
          <strong id="invoiceDue">0</strong>
        </article>
      </section>

      <section class="control-panel glass">
        <div class="view-summary">
          <span class="summary-dot"></span>
          <div>
            <strong id="controlTitle">全部项目</strong>
            <p id="controlMeta">48 个项目 · 按进度排序</p>
          </div>
        </div>
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜索项目、平台、人员或 KPI" />
        </label>
        <div class="quick-controls" aria-label="视图控制">
          <button class="publish-requirements-btn" id="publishRequirementsBtn" type="button">项目发稿数量需求</button>
          <button class="tool-btn active" data-sort="progress" type="button">进度</button>
          <button class="tool-btn" data-sort="deadline" type="button">截止</button>
          <button class="tool-btn" id="invoiceOnlyBtn" type="button">待开票</button>
          <button class="tool-icon" id="densityBtn" type="button" title="切换紧凑视图" aria-label="切换紧凑视图">≡</button>
        </div>
      </section>

      <section class="workspace">
        <aside class="status-sidebar glass">
          <div class="panel-head">
            <p class="eyebrow">Project Status</p>
            <h2>项目状态</h2>
          </div>
          <nav class="status-nav" id="statusTabs" aria-label="项目状态切换">
            <button class="active" data-filter="all">
              <span class="status-mark all"></span>
              <span>全部项目</span>
              <strong data-count="all">0</strong>
            </button>
            <button data-filter="进行中">
              <span class="status-mark running"></span>
              <span>进行中</span>
              <strong data-count="进行中">0</strong>
            </button>
            <button data-filter="已完成">
              <span class="status-mark done"></span>
              <span>已完成</span>
              <strong data-count="已完成">0</strong>
            </button>
            <button data-filter="待开始">
              <span class="status-mark waiting"></span>
              <span>待开始</span>
              <strong data-count="待开始">0</strong>
            </button>
            <button data-filter="停滞">
              <span class="status-mark paused"></span>
              <span>停滞</span>
              <strong data-count="停滞">0</strong>
            </button>
          </nav>
          <button class="sidebar-add-btn" id="openFormBtn" type="button">
            <span>＋</span>
            新增项目
          </button>
        </aside>

        <section class="project-page">
          <div class="page-head">
            <div>
              <p class="eyebrow">Current View</p>
              <h2 id="pageTitle">全部项目</h2>
            </div>
            <p id="pageMeta">0 个项目</p>
          </div>
          <section class="board" id="projectBoard" aria-live="polite"></section>
        </section>
      </section>
    </main>

    <dialog class="publish-dialog glass" id="publishRequirementsDialog" aria-labelledby="publishRequirementsTitle">
      <div class="publish-dialog-head">
        <div>
          <p class="eyebrow">Publishing Needs</p>
          <h2 id="publishRequirementsTitle">项目发稿数量需求</h2>
          <p>仅汇总当前进行中的项目</p>
        </div>
        <button class="dialog-close" id="publishRequirementsClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="publish-requirements-panel" id="publishRequirementsPanel"></div>
      <p class="publish-dialog-meta" id="publishRequirementsMeta"></p>
    </dialog>

    <dialog id="projectDialog" aria-labelledby="projectDialogTitle">
      <form class="project-form glass" id="projectForm">
        <div class="form-head">
          <div>
            <p class="eyebrow" id="projectDialogEyebrow">New Project</p>
            <h2 id="projectDialogTitle">添加项目</h2>
          </div>
          <button class="icon-btn" id="closeProjectDialog" type="button" aria-label="关闭">×</button>
        </div>
        <input type="hidden" id="projectId" />
        <div class="form-grid">
          <label>项目名称 <input id="name" required /></label>
          <label>状态
            <select id="status">
              <option>进行中</option>
              <option>待开始</option>
              <option>已完成</option>
              <option>停滞</option>
            </select>
          </label>
          <label>开始时间 <input id="startDate" type="date" /></label>
          <label>周期（天） <input id="cycleDays" type="number" min="0" /></label>
          <label class="wide">项目 KPI <textarea id="kpi"></textarea></label>
          <label>优化平台 <input id="platform" placeholder="如：5个平台" /></label>
          <label>开票信息
            <select id="invoiceStatus">
              <option>待确认</option>
              <option>待开票</option>
              <option>已开票</option>
              <option>无需开票</option>
            </select>
          </label>
          <label>项目经理
            <div class="people-picker" data-field="manager">
              <div class="selected-people" data-selected="manager"></div>
              <button class="picker-trigger" type="button">选择</button>
              <div class="picker-options" data-options="manager"></div>
            </div>
          </label>
          <label>写稿
            <div class="people-picker" data-field="writer">
              <div class="selected-people" data-selected="writer"></div>
              <button class="picker-trigger" type="button">选择</button>
              <div class="picker-options" data-options="writer"></div>
            </div>
          </label>
          <label>发稿
            <div class="people-picker" data-field="publisher">
              <div class="selected-people" data-selected="publisher"></div>
              <button class="picker-trigger" type="button">选择</button>
              <div class="picker-options" data-options="publisher"></div>
            </div>
          </label>
          <label>监测
            <div class="people-picker" data-field="monitor">
              <div class="selected-people" data-selected="monitor"></div>
              <button class="picker-trigger" type="button">选择</button>
              <div class="picker-options" data-options="monitor"></div>
            </div>
          </label>
          <label class="wide">发稿链接 <textarea id="publishLinks" placeholder="一行一个链接"></textarea></label>
          <label class="wide">监测表 <textarea id="monitorLinks" placeholder="一行一个链接"></textarea></label>
          <label class="wide">优化建议 <textarea id="optimizationSuggestion"></textarea></label>
          <label class="wide">备注 <textarea id="notes"></textarea></label>
        </div>
        <p class="form-sync-state" id="projectFormState" aria-live="polite"></p>
        <div class="form-actions">
          <button class="ghost-btn" id="cancelProjectBtn" type="button">取消</button>
          <button class="primary-btn" id="saveProjectBtn" type="submit">保存并同步飞书</button>
        </div>
      </form>
    </dialog>

    <script>
      window.FEISHU_SYNC_API = "https://oxygen-feishu-sync.liuyichen021231.workers.dev";
    </script>
    <script src="./data.js?v=20260810-feishu-status-files-v1"></script>
    <script src="./data-hotfix.js?v=20260810-feishu-status-files-v1"></script>
    <script src="./app.js?v=20260810-feishu-status-files-v1"></script>
  </body>
</html>
